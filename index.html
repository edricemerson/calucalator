<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Calculator</h1>

    <div class="calculator">
        <output class="screen" id="screen" aria-live="polite">0</output>

        <div class="keypad" id="keypad">
            <button class="key key--function" data-action="clear">AC</button>
            <button class="key key--function" data-action="negate">+/&minus;</button>
            <button class="key key--function" data-action="percent">%</button>
            <button class="key key--operator" data-action="operator" data-value="/">&divide;</button>

            <button class="key" data-action="digit" data-value="7">7</button>
            <button class="key" data-action="digit" data-value="8">8</button>
            <button class="key" data-action="digit" data-value="9">9</button>
            <button class="key key--operator" data-action="operator" data-value="*">&times;</button>

            <button class="key" data-action="digit" data-value="4">4</button>
            <button class="key" data-action="digit" data-value="5">5</button>
            <button class="key" data-action="digit" data-value="6">6</button>
            <button class="key key--operator" data-action="operator" data-value="-">&minus;</button>

            <button class="key" data-action="digit" data-value="1">1</button>
            <button class="key" data-action="digit" data-value="2">2</button>
            <button class="key" data-action="digit" data-value="3">3</button>
            <button class="key key--operator" data-action="operator" data-value="+">+</button>

            <button class="key key--zero" data-action="digit" data-value="0">0</button>
            <button class="key" data-action="decimal">.</button>
            <button class="key key--operator" data-action="equals">=</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
